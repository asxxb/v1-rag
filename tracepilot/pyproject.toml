[tool.poetry]
name = "tracepilot"
version = "0.1.0"
description = "Evidence-Driven Production Incident Investigation Agent"
authors = ["AI Engineer <ai@example.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.110.0"
uvicorn = ">=0.29.0"
pydantic = ">=2.6.4"
pydantic-settings = ">=2.2.1"
sqlalchemy = ">=2.0.29"
psycopg = {version = ">=3.2.10", extras = ["binary"]}
pgvector = ">=0.2.5"
httpx = ">=0.27.0"
openai = ">=1.14.2"
numpy = ">=1.26.4"
scikit-learn = ">=1.4.1.post1"
tenacity = ">=8.2.3"
python-dotenv = ">=1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
